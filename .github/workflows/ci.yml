name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Migrations, typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: facturdz
          POSTGRES_PASSWORD: facturdz
          POSTGRES_DB: facturdz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U facturdz"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql://facturdz:facturdz@localhost:5432/facturdz
      TEST_DATABASE_URL: postgresql://facturdz:facturdz@localhost:5432/facturdz_test
      SHADOW_DATABASE_URL: postgresql://facturdz:facturdz@localhost:5432/facturdz_shadow
      # Valeurs factices réservées à la CI (aucun secret réel).
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances (génère aussi le client Prisma)
        run: pnpm install --frozen-lockfile

      - name: Créer les bases de test et fantôme
        run: |
          PGPASSWORD=facturdz psql -h localhost -U facturdz -d facturdz -c "CREATE DATABASE facturdz_test;"
          PGPASSWORD=facturdz psql -h localhost -U facturdz -d facturdz -c "CREATE DATABASE facturdz_shadow;"

      - name: Valider le schéma Prisma
        run: pnpm exec prisma validate

      - name: Appliquer les migrations (prisma migrate deploy officiel)
        run: pnpm exec prisma migrate deploy

      - name: Détecter une dérive entre migrations et schéma
        run: |
          set +e
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::error::Les migrations ne correspondent pas à prisma/schema.prisma."
            echo "SQL officiel attendu pour la prochaine migration :"
            pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script | tee next-migration.sql
            exit 1
          fi
          exit $code

      - name: Publier le SQL attendu en cas de dérive
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-migration-sql
          path: next-migration.sql
          if-no-files-found: ignore

      - name: Vérification de schéma maison (identique à l'environnement local)
        run: pnpm db:verify

      - name: Seed de développement
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests unitaires et d'intégration (avec seuil de couverture)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Aucun secret dans le JavaScript envoyé au navigateur
        run: pnpm check:bundle

      - name: Installer Chromium pour les tests e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests de bout en bout (application compilée + base de démo)
        run: |
          pnpm start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 2; done
          pnpm test:e2e

      - name: Publier les traces e2e en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            test-results
            next.log
          if-no-files-found: ignore

  docker:
    name: Image Docker (build uniquement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image applicative
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=https://app.facturdz.example -t facturdz .
      - name: Construire l'image de migration
        run: docker build --target migrate -t facturdz-migrate .
